<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>3D ジャンプ</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #222; }
  canvas { display: block; }
  #ui {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    display: flex; gap: 8px; align-items: center;
    background: rgba(0, 0, 0, 0.6); padding: 10px 14px; border-radius: 8px;
    font: 18px sans-serif; color: #fff;
  }
  #answer { width: 100px; font-size: 20px; padding: 4px 8px; }
  #answer.wrong { outline: 3px solid #f44; }
  #msg { min-width: 120px; }
  #hearts {
    position: fixed; left: 16px; top: 12px;
    font: 36px sans-serif; color: #f33; text-shadow: 0 0 4px #000;
  }
  #upgrades {
    position: fixed; right: 16px; top: 12px; padding: 8px 12px;
    background: rgba(0, 0, 0, 0.55); color: #fff; font: 15px/1.6 sans-serif;
    border-radius: 8px; pointer-events: none;
  }
  #hit {
    position: fixed; inset: 0; background: #f00; opacity: 0;
    pointer-events: none; transition: opacity 0.2s;
  }
  #cross {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    color: #fff; font: 28px sans-serif; text-shadow: 0 0 3px #000; pointer-events: none;
  }
  #start {
    position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 20px;
    background: rgba(10, 20, 40, 0.9); color: #fff; font-family: sans-serif;
  }
  #start h1 { font-size: 48px; margin: 0; }
  #start ul { font-size: 18px; line-height: 1.8; max-width: 640px; padding: 0 16px 0 32px; }
  #ops { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; font-size: 20px; }
  #ops label { cursor: pointer; }
  #start .diffs { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  #start button {
    font-size: 26px; padding: 10px 28px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  #start button small { font-size: 14px; }
  #gameover {
    position: fixed; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    background: rgba(0, 0, 0, 0.7); color: #fff; font: 48px sans-serif;
  }
  #gameover button { font-size: 24px; padding: 8px 24px; }
</style>
</head>
<body>
<div id="start">
  <h1>かけ算シューティング</h1>
  <ul>
    <li>敵の頭の上の問題を見て、答えが書いてある銃を探して拾おう</li>
    <li>銃は右クリックで撃つ(答えが合う敵にだけダメージ。まちがうと敵が回復!)</li>
    <li>移動: WASD または矢印キー / ジャンプ: スペース / 見回し: マウス</li>
    <li>ハートは3つ。敵の弾に当たると1つ減る</li>
    <li>敵を全部たおすとボスが登場! ボスをたおすと次のウェーブへ(クリアなし)</li>
    <li>敵をたおすとポイントがもらえる。1:体力 2:攻撃力 3:足の速さ のキーで強くなれる</li>
  </ul>
  <div>計算の種類(いくつでも選べる)</div>
  <div id="ops">
    <label><input type="checkbox" value="＋"> たし算 ＋</label>
    <label><input type="checkbox" value="－"> ひき算 －</label>
    <label><input type="checkbox" value="×" checked> かけ算 ×</label>
    <label><input type="checkbox" value="÷"> わり算 ÷</label>
    <label><input type="checkbox" id="opsAll"> すべて</label>
  </div>
  <div>難易度をえらんでスタート</div>
  <div class="diffs">
    <button data-diff="easy">かんたん<small>敵2体 / ボスHP 200</small></button>
    <button data-diff="normal">ふつう<small>敵5体 / ボスHP 500</small></button>
    <button data-diff="hard">むずかしい<small>敵10体 / ボスHP 1000</small></button>
  </div>
</div>
<div id="hearts"></div>
<div id="upgrades"></div>
<div id="hit"></div>
<div id="cross">+</div>
<div id="gameover">
  <div id="gameover-text">ゲームオーバー</div>
  <button id="retry">もう一度</button>
</div>
<div id="ui">
  <span id="msg">答えが書いてある銃を探して拾おう</span>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
